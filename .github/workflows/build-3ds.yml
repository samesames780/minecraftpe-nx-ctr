name: Build 3DS

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cmake
        run: apt-get update && apt-get install -y cmake

      - name: Clone NovaGL
        run: git clone --depth=1 --branch CompressedAtlasData https://github.com/efimandreev0/NovaGL.git /tmp/NovaGL

      - name: Build NovaGL
        run: |
          mkdir -p /tmp/NovaGL/build
          cd /tmp/NovaGL/build
          cmake -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake -DGL2CITRO3D_BUILD_EXAMPLES=OFF ..
          make -j$(nproc)

      - name: Install NovaGL into devkitPro portlibs
        run: |
          mkdir -p $DEVKITPRO/portlibs/3ds/include
          mkdir -p $DEVKITPRO/portlibs/3ds/lib
          cp -r /tmp/NovaGL/include/* $DEVKITPRO/portlibs/3ds/include/
          find /tmp/NovaGL/build -name "*.a" -exec cp {} $DEVKITPRO/portlibs/3ds/lib/ \;
          echo "Archivos instalados:"
          ls -la $DEVKITPRO/portlibs/3ds/include/
          ls -la $DEVKITPRO/portlibs/3ds/lib/

      - name: Patch missing NovaGL frame wrappers
        run: |
          sed -i 's/nova_frame_begin();/C3D_FrameBegin(C3D_FRAME_SYNCDRAW);/' handheld/src/main_ctr.h
          sed -i 's/nova_frame_end();/C3D_FrameEnd(0);/' handheld/src/main_ctr.h
          grep -n "C3D_FrameBegin\|C3D_FrameEnd" handheld/src/main_ctr.h

      - name: Configure Minecraft
        run: cmake -DPUBLISH=on -B build -S handheld/project/ctr

      - name: Build Minecraft
        run: cmake --build build -j$(nproc)

      - name: Find output
        run: find build -iname "*.3dsx" -o -iname "minecraftcpp" -o -iname "minecraftcpp.elf"

      - name: Upload 3dsx
        uses: actions/upload-artifact@v4
        with:
          name: minecraftpe-3dsx
          path: build/**/*.3dsx

      - name: Download makerom and build bannertool
        run: |
          mkdir -p /tmp/tools
          cd /tmp/tools
          curl -L -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip
          unzip -o makerom.zip
          chmod +x makerom
          apt-get update && apt-get install -y cmake git
          git clone --depth=1 https://github.com/carstene1ns/3ds-bannertool.git
          cmake -B 3ds-bannertool/build -S 3ds-bannertool
          cmake --build 3ds-bannertool/build -j$(nproc)
          find 3ds-bannertool/build -maxdepth 2 -type f -executable
          BANNERTOOL=$(find 3ds-bannertool/build -maxdepth 2 -type f -iname "bannertool*" -executable | head -n1)
          cp "$BANNERTOOL" /tmp/tools/bannertool
          chmod +x /tmp/tools/bannertool

      - name: Generate icon and banner images
        run: |
          apt-get update && apt-get install -y python3 python3-pil
          python3 - <<'EOF'
          from PIL import Image
          Image.new("RGB", (48, 48), (60, 130, 60)).save("/tmp/tools/icon.png")
          Image.new("RGB", (256, 128), (40, 90, 40)).save("/tmp/tools/banner.png")
          EOF
          python3 - <<'EOF'
          import wave
          w = wave.open("/tmp/tools/banner.wav", "w")
          w.setnchannels(1)
          w.setsampwidth(2)
          w.setframerate(16000)
          w.writeframes(b"\x00\x00" * 1600)
          w.close()
          EOF

      - name: Build SMDH icon and banner files
        run: |
          cd /tmp/tools
          ./bannertool makesmdh -i icon.png -s "Minecraft PE" -l "Minecraft PE for 3DS (hambre)" -p "samesames780" -o icon.icn
          ./bannertool makebanner -i banner.png -a banner.wav -o banner.bnr

      - name: Build 3dstool and generate romfs.bin
        run: |
          apt-get update && apt-get install -y libcurl4-openssl-dev libssl-dev cmake git
          git clone --depth=1 https://github.com/dnasdw/3dstool.git /tmp/3dstool-src
          cmake -B /tmp/3dstool-src/build -S /tmp/3dstool-src -DUSE_DEP=OFF
          cmake --build /tmp/3dstool-src/build -j$(nproc)
          TOOLBIN=$(find /tmp/3dstool-src/build -maxdepth 3 -type f -iname "3dstool*" -executable | head -n1)
          echo "3dstool encontrado en: $TOOLBIN"
          cp "$TOOLBIN" /tmp/tools/3dstool
          chmod +x /tmp/tools/3dstool
          /tmp/tools/3dstool -cvtf romfs "$GITHUB_WORKSPACE/build/romfs.bin" --romfs-dir "$GITHUB_WORKSPACE/build/romfs_staging"
          ls -la "$GITHUB_WORKSPACE/build/romfs.bin"

      - name: Write RSF (CIA spec file)
        run: |
          cat > /tmp/tools/app.rsf <<'EOF'
          BasicInfo:
            Title : Minecraft PE Hambre
            ProductCode : CTR-P-MCH1
            Logo : Homebrew

          RomFs:
            RootPath : build/romfs.bin

          TitleInfo:
            Category : Application
            UniqueId : 0xff3fa

          Option:
            UseOnSD : true
            FreeProductCode : true
            MediaFootPadding : false
            EnableCrypt : false
            EnableCompress : true

          AccessControlInfo:
            CoreVersion : 2
            DescVersion : 2
            ReleaseKernelMajor : "02"
            ReleaseKernelMinor : "33"
            UseExtSaveData : false

            FileSystemAccess:
              - DirectSdmc
              - DirectSdmcWrite

            MemoryType : Application
            SystemMode : 64MB
            IdealProcessor : 0
            AffinityMask : 1
            Priority : 16
            MaxCpu : 0
            HandleTableSize : 0x200
            DisableDebug : false
            EnableForceDebug : false
            CanWriteSharedPage : true
            CanUsePrivilegedPriority : false
            CanUseNonAlphabetAndNumber : true
            PermitMainFunctionArgument : true
            CanShareDeviceMemory : true
            RunnableOnSleep : false
            SpecialMemoryArrange : true

            SystemModeExt : Legacy
            CpuSpeed : 268MHz
            EnableL2Cache : false
            CanAccessCore2 : false

            SystemCallAccess:
              ArbitrateAddress: 34
              Break: 60
              CancelTimer: 28
              ClearEvent: 25
              ClearTimer: 29
              CloseHandle: 35
              ConnectToPort: 45
              ControlMemory: 1
              CreateAddressArbiter: 33
              CreateEvent: 23
              CreateMemoryBlock: 30
              CreateMutex: 19
              CreateSemaphore: 21
              CreateThread: 8
              CreateTimer: 26
              DuplicateHandle: 39
              ExitProcess: 3
              ExitThread: 9
              GetCurrentProcessorNumber: 17
              GetHandleInfo: 41
              GetProcessId: 53
              GetProcessIdOfThread: 54
              GetProcessIdealProcessor: 6
              GetProcessInfo: 43
              GetResourceLimit: 56
              GetResourceLimitCurrentValues: 58
              GetResourceLimitLimitValues: 57
              GetSystemInfo: 42
              GetSystemTick: 40
              GetThreadContext: 59
              GetThreadId: 55
              GetThreadIdealProcessor: 15
              GetThreadInfo: 44
              GetThreadPriority: 11
              MapMemoryBlock: 31
              OutputDebugString: 61
              QueryMemory: 2
              ReleaseMutex: 20
              ReleaseSemaphore: 22
              SendSyncRequest1: 46
              SendSyncRequest2: 47
              SendSyncRequest3: 48
              SendSyncRequest4: 49
              SendSyncRequest: 50
              SetThreadPriority: 12
              SetTimer: 27
              SignalEvent: 24
              SleepThread: 10
              UnmapMemoryBlock: 32
              WaitSynchronization1: 36
              WaitSynchronizationN: 37
              Backdoor: 123

            ServiceAccessControl:
              - cfg:u
              - fs:USER
              - gsp::Gpu
              - hid:USER
              - ndm:u
              - APT:U
              - ac:u
              - act:u
              - am:net
              - boss:U
              - cam:u
              - cecd:u
              - csnd:SND
              - frd:u
              - http:C
              - ir:USER
              - ir:u
              - ir:rst
              - ldr:ro
              - mic:u
              - news:u
              - nim:aoc
              - nwm::UDS
              - ptm:u
              - soc:U
              - ssl:C
              - y2r:u

          SystemControlInfo:
            SaveDataSize: 0K
            RemasterVersion: 0
            StackSize: 0x40000

            Dependency:
              ac: 0x0004013000002402
              am: 0x0004013000001502
              boss: 0x0004013000003402
              camera: 0x0004013000001602
              cecd: 0x0004013000002602
              cfg: 0x0004013000001702
              codec: 0x0004013000001802
              csnd: 0x0004013000002702
              dlp: 0x0004013000002802
              dsp: 0x0004013000001a02
              friends: 0x0004013000003202
              gpio: 0x0004013000001b02
              gsp: 0x0004013000001c02
              hid: 0x0004013000001d02
              http: 0x0004013000002902
              i2c: 0x0004013000001e02
              ir: 0x0004013000003302
              mcu: 0x0004013000001f02
              mic: 0x0004013000002002
              ndm: 0x0004013000002b02
              news: 0x0004013000003502
              nim: 0x0004013000002c02
              nwm: 0x0004013000002d02
              pdn: 0x0004013000002102
              ps: 0x0004013000003102
              ptm: 0x0004013000002202
              ro: 0x0004013000003702
              socket: 0x0004013000002e02
              spi: 0x0004013000002302
              ssl: 0x0004013000002f02
          EOF
          sed -i "s|RootPath : build/romfs.bin|RootPath : $GITHUB_WORKSPACE/build/romfs.bin|" /tmp/tools/app.rsf
          echo "Verificando romfs.bin:"
          ls -la "$GITHUB_WORKSPACE/build/romfs.bin" 2>/dev/null || echo "NO EXISTE romfs.bin"
          grep -n "RootPath" /tmp/tools/app.rsf

      - name: Locate built ELF
        id: findelf
        run: |
          ELF=$(find build -maxdepth 3 -type f -name "minecraftcpp" | head -n1)
          if [ -z "$ELF" ]; then
            ELF=$(find build -maxdepth 3 -type f -name "minecraftcpp.elf" | head -n1)
          fi
          echo "Encontrado elf: $ELF"
          echo "elf=$ELF" >> "$GITHUB_OUTPUT"

          ROMFS=$(find build -maxdepth 2 -type d -name "romfs_staging" | head -n1)
          echo "Encontrado romfs: $ROMFS"
          echo "romfs=$ROMFS" >> "$GITHUB_OUTPUT"
          find "$ROMFS" -maxdepth 1

      - name: Build CIA with makerom
        run: |
          /tmp/tools/makerom -f cia \
            -o /tmp/tools/minecraftpe-hambre.cia \
            -rsf /tmp/tools/app.rsf \
            -target t \
            -elf "${{ steps.findelf.outputs.elf }}" \
            -icon /tmp/tools/icon.icn \
            -banner /tmp/tools/banner.bnr \
            -romfs "${{ steps.findelf.outputs.romfs }}"
          ls -la /tmp/tools/*.cia

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: minecraftpe-cia
          path: /tmp/tools/minecraftpe-hambre.cia
